# Baja video pipeline stack (design §20): orchestrator, review UI and the
# pipeline's own tailnet-side Caddy. Up only around events, via ./up.sh and
# ./down.sh (README §6).
#
# It hangs off the always-on BASE stack (repo jbresolin/baja-vps), which owns
# the public Caddy (container `caddy`, host 80/443), Evolution, Postgres,
# Redis and the external network `baja-edge`. The public routes for
# PIPELINE_DOMAIN are a conf.d snippet for that Caddy (conf.d/pipeline.caddy,
# installed by up.sh), not a service here. What this stack expects from the
# base stack: README §1.
#
# Every value comes from ./.env (copy .env.example). Each service gets an
# explicit `environment:` list instead of the whole .env, so secrets only
# reach the container that needs them.

name: baja-pipeline

# Cap container logs so they cannot eat the 70 GB disk (3 x 10 MB per service).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Orchestrator (LIVESTACK-24). Settings are BVP_* (design §15). The API is
  # defined in docs/api.md.
  # ---------------------------------------------------------------------------
  orchestrator:
    image: ${ORCHESTRATOR_IMAGE:-ghcr.io/jbresolin/baja-orchestrator:CHANGE-ME}
    restart: unless-stopped
    # Extra BVP_* settings beyond those below go in orchestrator.env. It's
    # optional, so the stack parses without it. Never BVP_DEV_MODE: the
    # orchestrator refuses to start with it here.
    env_file:
      - path: ./orchestrator.env
        required: false
    environment:
      # inbox/ proxies/ thumbs/ outbox/ db/bvp.sqlite3 all live under here.
      BVP_DATA_DIR: /srv/pipeline
      BVP_INBOX_HOLD_GB: ${BVP_INBOX_HOLD_GB:-22}
      BVP_INBOX_CAP_GB: ${BVP_INBOX_CAP_GB:-25}
      BVP_PROXY_EVICT_MIN_FREE_GB: ${BVP_PROXY_EVICT_MIN_FREE_GB:-10}
      BVP_WEBHOOK_SECRET: ${BVP_WEBHOOK_SECRET}
      BVP_ADMIN_TOKEN: ${BVP_ADMIN_TOKEN}
      # Same file the base Caddy imports for reviewer basic auth (design §17:
      # .txt, it is not htpasswd format).
      BVP_REVIEWERS_FILE: /srv/pipeline/reviewers.txt
      # The base stack's Evolution, on baja-edge.
      BVP_EVOLUTION_URL: http://evolution:8080
      BVP_EVOLUTION_INSTANCE: ${BVP_EVOLUTION_INSTANCE}
      # Canonical name (design §17); the orchestrator also accepts the old
      # BVP_EVOLUTION_INSTANCE_TOKEN.
      BVP_EVOLUTION_API_KEY: ${BVP_EVOLUTION_API_KEY}
      # Team names (design §17): CSV first, then the Baja app; both optional.
      BVP_TEAMS_FILE: ${BVP_TEAMS_FILE:-}
      BVP_BAJA_APP_URL: ${BVP_BAJA_APP_URL:-}
      BVP_PUBLIC_BASE_URL: https://${PIPELINE_DOMAIN}
      # Workers' inbox/outbox download URLs are built from this
      # (pipeline-edge's tailnet listener, not the orchestrator's own port).
      BVP_TAILNET_BASE_URL: http://${TAILSCALE_IP}:8080
      # Peers whose X-Forwarded-For is believed for the /enroll rate limit:
      # baja-edge (10.201.0.0/24, the base Caddy) and this stack's own
      # `pipeline` network (pipeline-edge). README §9; compose-smoke.sh checks
      # that baja-edge is covered.
      BVP_TRUSTED_PROXY_CIDRS: ${BVP_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,10.201.0.0/24,10.202.0.0/24}
      # Enrollment key minting (infra/tailnet/mint_auth_key.md).
      TAILSCALE_OAUTH_CLIENT_ID: ${TAILSCALE_OAUTH_CLIENT_ID:-}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${TAILSCALE_OAUTH_CLIENT_SECRET:-}
      TAILSCALE_TAILNET: ${TAILSCALE_TAILNET:--}
      TAILSCALE_API_BASE: ${TAILSCALE_API_BASE:-https://api.tailscale.com}
    volumes:
      # The whole data dir, same path inside and outside, so paths in logs
      # and DB rows mean the same thing on the host.
      - /srv/pipeline:/srv/pipeline
    networks:
      baja-edge:
        # A name nobody else on the shared network will use. The base Caddy
        # (/enroll) and Evolution (the instance webhook) reach us by it.
        aliases: [bvp-orchestrator]
      pipeline: {}
    # Listens on 8000. No published ports: the base Caddy and pipeline-edge
    # front it.
    mem_limit: 768m
    memswap_limit: 768m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Review UI (LIVESTACK-27, -26). Its own service (design §16): it talks to
  # the orchestrator only over the HTTP API, as the reviewer (it forwards the
  # browser's Authorization header). No database, no volumes.
  # Image: docker build -f review_ui/Dockerfile . (from the repo root).
  # ---------------------------------------------------------------------------
  review-ui:
    image: ${REVIEW_UI_IMAGE:-ghcr.io/jbresolin/baja-review-ui:CHANGE-ME}
    restart: unless-stopped
    depends_on:
      - orchestrator
    environment:
      # The alias, not the bare service name: a plain `orchestrator` from
      # another stack on baja-edge would be ambiguous.
      BVP_ORCHESTRATOR_URL: http://bvp-orchestrator:8000
      # Proxy and thumbnail links are built on the public site.
      BVP_PUBLIC_BASE_URL: https://${PIPELINE_DOMAIN}
    networks:
      baja-edge:
        # The base Caddy proxies /review* here.
        aliases: [bvp-review-ui]
      pipeline: {}
    # Listens on 8001. No published ports.
    expose:
      - "8001"
    mem_limit: 160m
    memswap_limit: 160m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # pipeline-edge: the tailnet-only listener (design §13), Caddyfile.tailnet.
  # Plain HTTP on ${TAILSCALE_IP}:8080 ONLY: the worker/studio API, and the
  # inbox/outbox bytes behind forward_auth. Not on baja-edge: it talks only
  # to the orchestrator, so the base Caddy carries nothing but public routes.
  # Binding to the Tailscale IP needs net.ipv4.ip_nonlocal_bind=1 on the
  # host (README §2.2). Without it Docker races tailscaled at boot.
  # ---------------------------------------------------------------------------
  pipeline-edge:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - orchestrator
    ports:
      - "${TAILSCALE_IP}:8080:8080"
    volumes:
      - ./Caddyfile.tailnet:/etc/caddy/Caddyfile:ro
      # BVP_DATA_DIR, read-only: inbox/ and outbox/ are served from here. The
      # inbox loop filesystem must be mounted before Docker starts (README
      # §2.3); Docker bind mounts are recursive, so it is included.
      - /srv/pipeline:/srv/pipeline:ro
    networks:
      - pipeline
    mem_limit: 128m
    memswap_limit: 128m
    logging: *default-logging

networks:
  # Owned by the base stack (README §1), which also sets its subnet
  # (10.201.0.0/24): no subnet here. Egress to the internet (WhatsApp CDN,
  # Tailscale API) and the base Caddy and Evolution are reached here.
  baja-edge:
    external: true
  # This stack's own: pipeline-edge <-> orchestrator <-> review UI. Not
  # `internal`, because Docker cannot publish a port from an internal network.
  # Pinned, so BVP_TRUSTED_PROXY_CIDRS can name it; next to baja-edge's
  # 10.201.0.0/24 and outside Docker's default 172.17-31.x pool.
  pipeline:
    ipam:
      config:
        - subnet: 10.202.0.0/24
