# Baja staging VPS stack (LIVESTACK-30).
#
# Services: Evolution API (WhatsApp "Baja Bot") + its Postgres and Redis,
# Caddy (the ONLY container that publishes ports), and an orchestrator stub.
# Runbook, memory budget and disk budget: infra/vps/README.md.
#
# Every value comes from ./.env (copy .env.example). Each service gets an
# explicit `environment:` list instead of the whole .env, so secrets only
# reach the container that needs them.

name: baja

# Cap container logs so they cannot eat the 70 GB disk (3 x 10 MB per service).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Evolution API v2 — WhatsApp gateway for the Baja Bot account.
  # Pinned to the latest STABLE tag. `latest` was moved on 2026-05-06 next to
  # 2.4.0-rc1, and 2.4.0 adds mandatory license activation (see README §10),
  # so never use `latest` here.
  # ---------------------------------------------------------------------------
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # --- server ---
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      # Public URL. Evolution puts it in webhook payloads (`server_url`).
      SERVER_URL: https://${EVO_DOMAIN}
      TELEMETRY_ENABLED: "false"
      # Swagger UI is not needed in production. The Manager UI stays on.
      SERVER_DISABLE_DOCS: "true"
      CORS_ORIGIN: https://${EVO_DOMAIN}
      LOG_LEVEL: ERROR,WARN,INFO,LOG
      LOG_BAILEYS: error
      # Never auto-delete a disconnected instance. Deleting it would throw away
      # the WhatsApp session we are migrating.
      DEL_INSTANCE: "false"
      # Keep V8's heap under the container limit so Node GCs before the kernel
      # OOM-kills it (limit 1 GiB, heap 640 MiB, rest = buffers/native).
      NODE_OPTIONS: --max-old-space-size=640

      # --- database (session creds live in table "Session") ---
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=${EVOLUTION_DB_SCHEMA}
      # MUST equal the TrueNAS value. Evolution only loads instances whose
      # "clientName" column matches this.
      DATABASE_CONNECTION_CLIENT_NAME: ${EVOLUTION_CLIENT_NAME}
      # MUST stay true. This turns on DB-backed auth state (useMultiFileAuthStatePrisma).
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: ${EVOLUTION_SAVE_NEW_MESSAGE:-true}
      DATABASE_SAVE_MESSAGE_UPDATE: ${EVOLUTION_SAVE_MESSAGE_UPDATE:-false}
      DATABASE_SAVE_DATA_CONTACTS: ${EVOLUTION_SAVE_CONTACTS:-true}
      DATABASE_SAVE_DATA_CHATS: ${EVOLUTION_SAVE_CHATS:-true}
      DATABASE_SAVE_DATA_LABELS: ${EVOLUTION_SAVE_LABELS:-false}
      DATABASE_SAVE_DATA_HISTORIC: ${EVOLUTION_SAVE_HISTORIC:-false}

      # --- redis (with Redis enabled, every Signal key EXCEPT creds lives here) ---
      CACHE_REDIS_ENABLED: "true"
      # DB index and prefix MUST equal the TrueNAS values, or the migrated
      # keys are invisible to the new instance.
      CACHE_REDIS_URI: redis://redis:6379/${EVOLUTION_REDIS_DB}
      CACHE_REDIS_PREFIX_KEY: ${EVOLUTION_REDIS_PREFIX}
      CACHE_REDIS_SAVE_INSTANCES: ${EVOLUTION_REDIS_SAVE_INSTANCES:-false}
      CACHE_REDIS_TTL: "604800"
      CACHE_LOCAL_ENABLED: "false"

      # --- auth ---
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # --- session look on the phone (keep the TrueNAS values) ---
      CONFIG_SESSION_PHONE_CLIENT: ${EVOLUTION_PHONE_CLIENT:-Evolution API}
      CONFIG_SESSION_PHONE_NAME: ${EVOLUTION_PHONE_NAME:-Chrome}
      QRCODE_LIMIT: "30"

      # --- webhooks (topology in README §6) ---
      # Global webhook = n8n/BajaBot (phase B). The instance webhook (stored in
      # Postgres, set via API) = orchestrator.
      WEBHOOK_GLOBAL_ENABLED: ${N8N_GLOBAL_WEBHOOK_ENABLED:-false}
      WEBHOOK_GLOBAL_URL: ${N8N_WEBHOOK_URL:-}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: ${N8N_WEBHOOK_BY_EVENTS:-false}
      # Bound retries so a dead consumer delays the next one by at most
      # ~2 min (5+10+20+40+60 s) instead of the default ~20 min.
      WEBHOOK_REQUEST_TIMEOUT_MS: "30000"
      WEBHOOK_RETRY_MAX_ATTEMPTS: "6"
      WEBHOOK_RETRY_INITIAL_DELAY_SECONDS: "5"
      WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF: "true"
      WEBHOOK_RETRY_MAX_DELAY_SECONDS: "60"
      # Events sent to the GLOBAL webhook (n8n). Copy the list BajaBot uses
      # today (README §1.4). These do not affect the instance webhook.
      WEBHOOK_EVENTS_APPLICATION_STARTUP: ${WEBHOOK_EVENTS_APPLICATION_STARTUP:-false}
      WEBHOOK_EVENTS_QRCODE_UPDATED: ${WEBHOOK_EVENTS_QRCODE_UPDATED:-false}
      WEBHOOK_EVENTS_CONNECTION_UPDATE: ${WEBHOOK_EVENTS_CONNECTION_UPDATE:-false}
      WEBHOOK_EVENTS_MESSAGES_SET: ${WEBHOOK_EVENTS_MESSAGES_SET:-false}
      WEBHOOK_EVENTS_MESSAGES_UPSERT: ${WEBHOOK_EVENTS_MESSAGES_UPSERT:-false}
      WEBHOOK_EVENTS_MESSAGES_EDITED: ${WEBHOOK_EVENTS_MESSAGES_EDITED:-false}
      WEBHOOK_EVENTS_MESSAGES_UPDATE: ${WEBHOOK_EVENTS_MESSAGES_UPDATE:-false}
      WEBHOOK_EVENTS_MESSAGES_DELETE: ${WEBHOOK_EVENTS_MESSAGES_DELETE:-false}
      WEBHOOK_EVENTS_SEND_MESSAGE: ${WEBHOOK_EVENTS_SEND_MESSAGE:-false}
      WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE: ${WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE:-false}
      WEBHOOK_EVENTS_CONTACTS_SET: ${WEBHOOK_EVENTS_CONTACTS_SET:-false}
      WEBHOOK_EVENTS_CONTACTS_UPSERT: ${WEBHOOK_EVENTS_CONTACTS_UPSERT:-false}
      WEBHOOK_EVENTS_CONTACTS_UPDATE: ${WEBHOOK_EVENTS_CONTACTS_UPDATE:-false}
      WEBHOOK_EVENTS_PRESENCE_UPDATE: ${WEBHOOK_EVENTS_PRESENCE_UPDATE:-false}
      WEBHOOK_EVENTS_CHATS_SET: ${WEBHOOK_EVENTS_CHATS_SET:-false}
      WEBHOOK_EVENTS_CHATS_UPSERT: ${WEBHOOK_EVENTS_CHATS_UPSERT:-false}
      WEBHOOK_EVENTS_CHATS_UPDATE: ${WEBHOOK_EVENTS_CHATS_UPDATE:-false}
      WEBHOOK_EVENTS_CHATS_DELETE: ${WEBHOOK_EVENTS_CHATS_DELETE:-false}
      WEBHOOK_EVENTS_GROUPS_UPSERT: ${WEBHOOK_EVENTS_GROUPS_UPSERT:-false}
      WEBHOOK_EVENTS_GROUPS_UPDATE: ${WEBHOOK_EVENTS_GROUPS_UPDATE:-false}
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: ${WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE:-false}
      WEBHOOK_EVENTS_LABELS_EDIT: ${WEBHOOK_EVENTS_LABELS_EDIT:-false}
      WEBHOOK_EVENTS_LABELS_ASSOCIATION: ${WEBHOOK_EVENTS_LABELS_ASSOCIATION:-false}
      WEBHOOK_EVENTS_CALL: ${WEBHOOK_EVENTS_CALL:-false}
      WEBHOOK_EVENTS_REMOVE_INSTANCE: ${WEBHOOK_EVENTS_REMOVE_INSTANCE:-false}
      WEBHOOK_EVENTS_LOGOUT_INSTANCE: ${WEBHOOK_EVENTS_LOGOUT_INSTANCE:-false}

      # Media goes NOT to S3 and NOT base64 into webhooks. 2 GB documents
      # would be buffered in this container's RAM (README §6.3).
      S3_ENABLED: "false"
    volumes:
      # Per-instance auth-key files (used when Redis is off) and other local
      # instance data. Migrated as-is from TrueNAS.
      - evolution_instances:/evolution/instances
    networks:
      - edge
      - evolution_db
    # No `ports:`. Only Caddy reaches it, at evolution:8080 on `edge`.
    mem_limit: 1024m
    memswap_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Postgres for Evolution. Major 15 as in the upstream compose. If TrueNAS
  # runs a NEWER major, bump this to match before restoring (README §1.3).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15.19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Small-box tuning. Upstream ships max_connections=1000, which costs RAM
    # for nothing with one Evolution process (Prisma pool ~5).
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_db
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis for Evolution. This holds the WhatsApp Signal keys, so it is a
  # DATABASE here, not a throwaway cache:
  #   - appendonly yes: survive restarts.
  #   - volatile-lru: under memory pressure, evict only keys that have a TTL
  #     (message caches). Auth-key hashes have no TTL and are never evicted.
  # Version must be >= the TrueNAS Redis so it can load the copied files.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 160mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - evolution_db
    # 160 MB dataset + headroom for the AOF-rewrite fork (copy-on-write).
    mem_limit: 320m
    memswap_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Caddy — the only container with published ports.
  #   80/443 on all interfaces: public vhosts (TLS via Let's Encrypt).
  #   ${TAILSCALE_IP}:8080: tailnet-only worker API (plain HTTP, design §13).
  #   Binding to the Tailscale IP needs net.ipv4.ip_nonlocal_bind=1 on the
  #   host (README §2.2). Without it Docker races tailscaled at boot.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "${TAILSCALE_IP}:8080:8080"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      EVO_DOMAIN: ${EVO_DOMAIN}
      PIPELINE_DOMAIN: ${PIPELINE_DOMAIN}
      MANAGER_BASIC_AUTH_USER: ${MANAGER_BASIC_AUTH_USER}
      MANAGER_BASIC_AUTH_HASH: ${MANAGER_BASIC_AUTH_HASH}
      REVIEW_BASIC_AUTH_USER: ${REVIEW_BASIC_AUTH_USER}
      REVIEW_BASIC_AUTH_HASH: ${REVIEW_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Static byte path (no app process): proxies publicly behind auth,
      # inbox/outbox only on the tailnet vhost. Read-only for Caddy.
      - /srv/pipeline/proxies:/srv/pipeline/proxies:ro
      - /srv/pipeline/inbox:/srv/pipeline/inbox:ro
      - /srv/pipeline/outbox:/srv/pipeline/outbox:ro
    networks:
      - edge
    mem_limit: 192m
    memswap_limit: 192m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Orchestrator STUB (LIVESTACK-24). The orchestrator PR fills in the image
  # and its settings. Behind the `orchestrator` profile, so the Evolution
  # migration can run before any orchestrator image exists:
  #   docker compose --profile orchestrator up -d
  # Contract with this stack: README §11.
  # ---------------------------------------------------------------------------
  orchestrator:
    profiles: ["orchestrator"]
    image: ${ORCHESTRATOR_IMAGE:-ghcr.io/jbresolin/baja-orchestrator:CHANGE-ME}
    restart: unless-stopped
    depends_on:
      evolution:
        condition: service_healthy
    # App-specific settings the orchestrator PR adds go in orchestrator.env.
    # Optional, so the stack still parses before that file exists.
    env_file:
      - path: ./orchestrator.env
        required: false
    environment:
      PUBLIC_BASE_URL: https://${PIPELINE_DOMAIN}
      TAILNET_BASE_URL: http://${TAILSCALE_IP}:8080
      DATA_DIR: /var/lib/orchestrator
      INBOX_DIR: /srv/pipeline/inbox
      OUTBOX_DIR: /srv/pipeline/outbox
      PROXIES_DIR: /srv/pipeline/proxies
      INBOX_CAP_GB: ${INBOX_CAP_GB:-25}
      INBOX_HOLD_GB: ${INBOX_HOLD_GB:-22}
      PROXY_EVICT_MIN_FREE_GB: ${PROXY_EVICT_MIN_FREE_GB:-10}
      EVOLUTION_BASE_URL: http://evolution:8080
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      EVOLUTION_INSTANCE_TOKEN: ${EVOLUTION_INSTANCE_TOKEN}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      TAILSCALE_OAUTH_CLIENT_ID: ${TAILSCALE_OAUTH_CLIENT_ID:-}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${TAILSCALE_OAUTH_CLIENT_SECRET:-}
      TAILSCALE_TAILNET: ${TAILSCALE_TAILNET:-}
    volumes:
      # SQLite (WAL) jobs DB and other orchestrator state.
      - orchestrator_data:/var/lib/orchestrator
      # Same paths inside and outside, so logs and DB rows mean the same
      # path on the host and in the container.
      - /srv/pipeline/inbox:/srv/pipeline/inbox
      - /srv/pipeline/outbox:/srv/pipeline/outbox
      - /srv/pipeline/proxies:/srv/pipeline/proxies
    networks:
      - edge
    # Listens on 8000 inside `edge`. No published ports, Caddy fronts it.
    mem_limit: 768m
    memswap_limit: 768m
    logging: *default-logging

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  orchestrator_data:

networks:
  # Caddy <-> Evolution <-> orchestrator. Needs internet egress (WhatsApp).
  edge:
  # Evolution <-> Postgres/Redis only. `internal` = no egress, unreachable
  # from Caddy and the orchestrator.
  evolution_db:
    internal: true
