[project]
name = "worker"
version = "0.1.0"
description = "Worker app (roles: master, worker, studio): holds raws, renders proxies and clips, delivers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pillow>=11",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
