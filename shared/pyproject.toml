[project]
name = "shared"
version = "0.1.0"
description = "Models, state machine, hashing, transfers and ffmpeg helpers shared by every service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    # HKDF + AES-256-CBC + HMAC for decrypting WhatsApp media (whatsapp_media.py).
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
