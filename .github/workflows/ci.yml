name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      # The review UI's date/number tests run js/format.js in Node too.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: OpenAPI contract is up to date
        run: uv run python tools/generate_openapi.py --check

      # ffmpeg is not installed here, so the integration test is skipped.
      - name: Tests
        run: uv run pytest
