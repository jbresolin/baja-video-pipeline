name: Windows installer

# Builds BajaWorker-Setup-<version>.exe (installer/README.md, MAINTAINERS.md).
# Releases: push a tag v<installer/VERSION>; the installer is attached to the
# GitHub Release of that tag. Test builds: run it by hand (workflow_dispatch),
# and every PR that touches the installer gets one too.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "installer/**"
      - "tests/installer/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:
    inputs:
      enroll_url:
        description: "Public site that routes POST /enroll. Empty = repository variable BVP_ENROLL_URL"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Everything that does not need Windows runs on Linux first: the installer
  # tests and a frozen build of the same entry point.
  linux:
    runs-on: ubuntu-latest
    env:
      # The Linux twin of vendor.lock's [ffmpeg] (same BtbN release, static
      # linux64 GPL build). Bump both together: installer/MAINTAINERS.md.
      LINUX_FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-27-18-38/ffmpeg-n9.0.2-36-g6882969ce9-linux64-gpl-9.0.tar.xz
      LINUX_FFMPEG_SHA256: 8ce0fd17fb808adf48d66c3e72d7f0acfc28d2b95a0f6bf98483be8c652083ed
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --group installer

      # A pinned build checked against its SHA-256, kept in the Actions cache.
      # Not apt-get: Ubuntu's mirrors once hung this step for 24 minutes.
      - name: Cache the pinned ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-download
          key: linux-ffmpeg-${{ env.LINUX_FFMPEG_SHA256 }}

      - name: Install ffmpeg (bundled into the Linux smoke build)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p ~/ffmpeg-download ~/ffmpeg
          archive=~/ffmpeg-download/ffmpeg-linux64.tar.xz
          # Download only when the cache did not bring the right file.
          if ! echo "$LINUX_FFMPEG_SHA256  $archive" | sha256sum --check --status; then
            curl -fsSL --retry 3 --max-time 300 -o "$archive" "$LINUX_FFMPEG_URL"
            echo "$LINUX_FFMPEG_SHA256  $archive" | sha256sum --check
          fi
          # Only the two tools the build bundles (the archive also has ffplay).
          tar -xJf "$archive" -C ~/ffmpeg --strip-components=1 \
            --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          ~/ffmpeg/bin/ffmpeg -hide_banner -version | head -1

      - name: Installer tests
        run: uv run pytest tests/installer

      - name: Frozen build (Linux)
        run: uv run python installer/build.py --ffmpeg-from-path

      - name: Smoke test the frozen exe
        run: |
          installer/dist/BajaWorker/BajaWorker --version
          installer/dist/BajaWorker/BajaWorker --check
          # The tray is frozen into the same folder (it needs Windows to run).
          test -x installer/dist/BajaWorker/BajaWorkerTray

  windows:
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write # attach the installer to the release
    env:
      ENROLL_URL: ${{ inputs.enroll_url || vars.BVP_ENROLL_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --group installer

      - name: Releases need an enroll URL and a tag that matches installer/VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(tr -d '\r\n' < installer/VERSION)"
          if [ -z "$ENROLL_URL" ]; then
            echo "::error::Set the repository variable BVP_ENROLL_URL (public /enroll site)"; exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match installer/VERSION ($version)"; exit 1
          fi

      - name: Warn when a test build has no enroll URL
        if: env.ENROLL_URL == ''
        shell: bash
        run: echo "::warning::No enroll URL; this build's worker.json will not know where to enroll."

      # The pinned payloads never change for a given lock, so cache them.
      - name: Cache vendor downloads
        uses: actions/cache@v4
        with:
          path: installer/vendor/downloads
          key: vendor-${{ hashFiles('installer/vendor.lock') }}

      - name: Fetch and verify vendor payloads (SHA-256 from vendor.lock)
        run: uv run python installer/fetch_vendor.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build BajaWorker.exe and the Setup .exe
        shell: bash
        run: uv run python installer/build.py --compile-installer ${ENROLL_URL:+--enroll-url "$ENROLL_URL"}

      - name: Smoke test the frozen exe
        shell: pwsh
        run: |
          $exe = "installer\dist\BajaWorker\BajaWorker.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "installer\dist\BajaWorker\BajaWorkerTray.exe")) { exit 1 }

      - name: Install, check, upgrade and uninstall the Setup .exe
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\output\BajaWorker-Setup-*.exe).FullName
          ./installer/ci/smoke_install.ps1 -Setup $setup

      - name: Checksum
        shell: bash
        run: |
          cd installer/output
          sha256sum BajaWorker-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BajaWorker-Setup
          path: |
            installer/output/BajaWorker-Setup-*.exe
            installer/output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes "Instalador do Baja Worker para Windows. Veja installer/README.md."
          fi
          gh release upload "$GITHUB_REF_NAME" installer/output/BajaWorker-Setup-*.exe \
            installer/output/SHA256SUMS.txt --clobber
          # Deleting a tag turns its Release back into a draft, and re-pushing
          # the tag finds that draft above instead of creating a new Release.
          # Publish explicitly so a re-tagged version never stays hidden.
          gh release edit "$GITHUB_REF_NAME" --draft=false
