      description: Static admin token (BVP_ADMIN_TOKEN on the orchestrator).
      scheme: bearer
    workerBearer:
      type: http
      description: Per-worker token returned by POST /enroll.
      scheme: bearer
    reviewerBasic:
      type: http
      description: Reviewer username and password, checked against the bcrypt hashes in BVP_REVIEWERS_FILE
        (the same file Caddy imports). See docs/api.md.
      scheme: basic
