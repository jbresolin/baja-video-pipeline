            maximum: 65535.0
            minimum: 1.0
          - type: 'null'
          title: File Server Port
        receiver_port:
          anyOf:
          - type: integer
            maximum: 65535.0
            minimum: 1.0
          - type: 'null'
          title: Receiver Port
        enrolled_at:
          type: string
          format: date-time
          title: Enrolled At
        last_heartbeat:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Heartbeat
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - role
      - capabilities
      - enrolled_at
      title: Worker
      description: A machine running the worker app, as the orchestrator stores it.
    WorkerCapabilities:
      properties:
        has_nvenc:
          type: boolean
          title: Has Nvenc
        video_encoder:
          type: string
          title: Video Encoder
        ffmpeg_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Ffmpeg Version
        os:
          anyOf:
          - type: string
          - type: 'null'
          title: Os
        cpu_count:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Cpu Count
        gpu_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Gpu Name
      additionalProperties: false
      type: object
      required:
      - has_nvenc
      - video_encoder
      title: WorkerCapabilities
      description: What the worker's machine can do. Reported at enrollment and on change.
    WorkerRole:
      type: string
      enum:
      - master
      - worker
      - studio
      title: WorkerRole
    WorkerStats:
      properties:
        download_mbps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Download Mbps
        process_s_per_gb:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Process S Per Gb
        upload_mbps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Upload Mbps
      additionalProperties: false
      type: object
      title: WorkerStats
      description: 'Rolling averages the orchestrator computes from worker measurements.


        None means "not measured yet": there is no calibration phase (design §5),

        so a new worker starts with no numbers and gets them from its first jobs.'
  securitySchemes:
    webhookSecret:
      type: apiKey
      description: Shared secret set as a custom header in Evolution's webhook config.
      in: header
      name: X-Webhook-Secret
    sessionBearer:
      type: http
      description: Session token from POST /auth/login. Review routes accept a user with role reviewer
        or admin; /admin/* routes need role admin (403 for a reviewer). Sessions end after 12 h without
        a request.
      scheme: bearer
    adminBearer:
      type: http
      description: Static admin token (BVP_ADMIN_TOKEN on the orchestrator).
      scheme: bearer
    workerBearer:
      type: http
      description: Per-worker token returned by POST /enroll.
      scheme: bearer
    sessionCookie:
      type: apiKey
      description: The session token as the review UI's cookie. Read only by GET /auth/media, which Caddy's
        forward_auth calls with the browser's own headers.
      in: cookie
      name: bvp_session
