  /jobs/{job_id}/review:
    patch:
      tags:
      - review
      summary: Save fields and cuts; optionally mark ready or reprocess
      description: "* `expected_version` ≠ current → 409 `version_conflict` (reload and retry).\n* `action:\
        \ ready` from awaiting_review → ready.\n* `action: reprocess` from claimed/uploaded/delivered/done\
        \ → ready; any\n  process lease is revoked (the worker sees `lost` on its next heartbeat).\n*\
        \ Other state/action combinations → 409 `illegal_transition`.\n* ready/reprocess with prova, car_number,\
        \ passagem or a cut missing → 422\n  `missing_review_fields` (details.missing lists them).\n*\
        \ `team_name` is resolved from car_number when it changes.\n* cut_out_s beyond the known duration\
        \ → 422 `validation_error`."
      operationId: update_review_jobs__job_id__review_patch
      security:
      - reviewerBasic: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdate'
