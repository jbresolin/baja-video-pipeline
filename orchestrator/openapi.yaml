openapi: 3.1.0
info:
  title: Baja video pipeline — orchestrator API
  description: 'Orchestrator API of the Baja video pipeline v2. Generated from

    tools/openapi_contract (FastAPI stubs over shared.models); prose,

    flows and the chunked upload protocol are in docs/api.md.

    Do not edit this file by hand: run `uv run python tools/generate_openapi.py`.

    '
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - meta
      summary: Liveness check (no auth)
      description: 'Answers {"status": "ok"} when the process is up. For Caddy and monitoring.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /intake/evolution-webhook:
    post:
      tags:
      - intake
      summary: Evolution messages.upsert webhook → job
      description: "Turn a WhatsApp video into a job.\n\n* Only `event == \"messages.upsert\"` with `data.key.fromMe\
        \ == false` is\n  considered; anything else gets 200 with `ignored: true`.\n* A `documentMessage`\
        \ with a `video/*` mimetype → normal job. A\n  `videoMessage` → job with `low_res: true` (and\
        \ the bot asks for a\n  resend as document). Other messages → `ignored: true`.\n* The raw is downloaded\
        \ from `data.message.mediaUrl` (Evolution S3/MinIO\n  media storage) into the inbox, SHA-256 computed,\
        \ job created in\n  state `received`.\n* Duplicate `data.key.id` → 200 with `duplicate: true`\
        \ and the existing\n  `job_id` (Evolution retries webhooks).\n* Inbox above its hard cap → 413\
        \ `inbox_full` (the bot tells the sender\n  to hold)."
      operationId: evolution_webhook_intake_evolution_webhook_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvolutionWebhook'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large (upload_too_large, inbox_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable (dev_mode_disabled, upstream_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - webhookSecret: []
  /intake/test-upload:
    post:
      tags:
      - intake
      summary: 'Dev only: upload a file as if it came from WhatsApp'
      description: 'Same result as the webhook, from a multipart upload.


        Enabled only when the orchestrator runs with BVP_DEV_MODE=1; otherwise

        503 `dev_mode_disabled`.'
      operationId: test_upload_intake_test_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_test_upload_intake_test_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large (upload_too_large, inbox_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable (dev_mode_disabled, upstream_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - adminBearer: []
  /admin/enrollment-tokens:
    post:
      tags:
      - enrollment
      summary: Create a one-time enrollment token for a volunteer
      description: The plaintext token is returned once; only its SHA-256 is stored.
      operationId: create_enrollment_token_admin_enrollment_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentTokenRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenCreated'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - adminBearer: []
  /enroll:
    post:
      tags:
      - enrollment
      summary: Exchange a one-time token for worker id, bearer token and Tailscale key
      description: 'No auth header: the enrollment token in the body is the credential.


        The token is marked used on success, so a second call with it gets 401

        `enrollment_token_invalid` (also for unknown or expired tokens). The

        Tailscale key is minted through the Tailscale API (OAuth client,

        auth-keys scope) as single-use, pre-approved, non-ephemeral and tagged

        `tag:worker` (or `tag:studio` for the studio role). If the Tailscale API

        fails: 503 `upstream_error` and the token stays unused.'
      operationId: enroll_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable (dev_mode_disabled, upstream_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/heartbeat:
    post:
      tags:
      - worker loop
      summary: 'Every 15 s: disk, measurements, and renew listed leases'
      description: '`worker_id` must be the caller''s own id (else 403).'
      operationId: heartbeat_workers__worker_id__heartbeat_post
      security:
      - workerBearer: []
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/next:
    post:
      tags:
      - worker loop
      summary: 'Pull: what should I do next? (an offer; claim it to start)'
      description: 'Returns at most one task among `accept_kinds`, or `task: null`.


        Never offers `download_raw` to a studio or to a worker that is not

        accepting new raws; never offers `make_proxy`/`process` to a worker

        that is not a confirmed holder; only offers `deliver` to studios.'
      operationId: next_task_workers__worker_id__next_post
      security:
      - workerBearer: []
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NextTaskRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextTaskResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers:
    get:
      tags:
      - worker loop
      summary: Peer list with tailnet addresses (for peer raw fetches and studio push)
      operationId: list_peers_workers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeersResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - workerBearer: []
  /jobs/{job_id}/claim:
    post:
      tags:
      - worker loop
      summary: Take a lease on one task of a job
      description: '409 `already_claimed` if someone else won; 409 `not_claimable` if

        the job is not in a state for that task or the caller is not eligible.

        Claiming `process` moves the job ready → claimed.'
      operationId: claim_jobs__job_id__claim_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/lease/renew:
    post:
      tags:
      - worker loop
      summary: Extend one lease (heartbeats also renew)
      description: 409 `lease_lost` if the lease already expired or was revoked.
      operationId: renew_lease_jobs__job_id__lease_renew_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseRenewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseRenewResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/raw:
    get:
      tags:
      - worker loop
      summary: Download the raw from the VPS inbox (supports Range)
      description: '404 once two holders confirmed and the VPS deleted its copy; fetch

        from a peer then (download_raw task `sources`).'
      operationId: download_raw_jobs__job_id__raw_get
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: Range
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Range
      responses:
        '200':
          description: The whole file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range (see Content-Range)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: Range Not Satisfiable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/holder-confirm:
    post:
      tags:
      - worker loop
      summary: I hold the raw and its SHA-256 matched
      description: 'Ends the download_raw lease. 422 `hash_mismatch` if the reported hash

        differs from the job''s (the caller is dropped as holder and must delete

        its copy).'
      operationId: holder_confirm_jobs__job_id__holder_confirm_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolderConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolderConfirmResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Well-formed but wrong (hash_mismatch, missing_review_fields, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/{job_id}/proxy:
    post:
      tags:
      - worker loop
      summary: Chunked upload of the 480p proxy (MP4)
      description: 'On the completing chunk: proxy stored, `proxy_available` true, a

        `received` job moves to proxy_ready → awaiting_review, and the

        make_proxy lease ends. Upload the thumbnail *before* the proxy.'
      operationId: upload_proxy_jobs__job_id__proxy_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: Upload-Offset
        in: header
        required: true
        schema:
          type: integer
          title: Upload-Offset
      - name: Upload-Length
        in: header
        required: true
        schema:
          type: integer
          title: Upload-Length
      - name: Upload-SHA256
        in: header
        required: true
        schema:
          type: string
          title: Upload-Sha256
      - name: Lease-Id
        in: header
        required: true
        schema:
          type: string
          title: Lease-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkAccepted'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large (upload_too_large, inbox_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Well-formed but wrong (hash_mismatch, missing_review_fields, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: One chunk of the file, starting at byte Upload-Offset. See docs/api.md, Chunked uploads.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /jobs/{job_id}/thumbnail:
    put:
      tags:
      - worker loop
      summary: Upload the review-queue thumbnail (one JPEG, single request)
      operationId: upload_thumbnail_jobs__job_id__thumbnail_put
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: Lease-Id
        in: header
        required: true
        schema:
          type: string
          title: Lease-Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large (upload_too_large, inbox_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
  /jobs/{job_id}/clip:
    post:
      tags:
      - worker loop
      summary: Chunked upload of the finished clip to the VPS outbox (fallback route)
      description: 'On the completing chunk: clip stored in the outbox, job claimed →

        uploaded (route `outbox`), process lease released, and a `deliver` task

        becomes available to the studio.'
      operationId: upload_clip_jobs__job_id__clip_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: Upload-Offset
        in: header
        required: true
        schema:
          type: integer
          title: Upload-Offset
      - name: Upload-Length
        in: header
        required: true
        schema:
          type: integer
          title: Upload-Length
      - name: Upload-SHA256
        in: header
        required: true
        schema:
          type: string
          title: Upload-Sha256
      - name: Lease-Id
        in: header
        required: true
        schema:
          type: string
          title: Lease-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkAccepted'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large (upload_too_large, inbox_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Well-formed but wrong (hash_mismatch, missing_review_fields, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: One chunk of the file, starting at byte Upload-Offset. See docs/api.md, Chunked uploads.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /jobs/{job_id}/delivered:
    post:
      tags:
      - delivery
      summary: Studio ACK after a direct push from a worker
      description: 'Studio role only (403 otherwise). Accepted from `claimed` (the

        orchestrator records claimed → uploaded → delivered, route `direct`)

        or from `uploaded`. Then → done. Repeating the call is a no-op 200.'
      operationId: delivered_jobs__job_id__delivered_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveredRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
