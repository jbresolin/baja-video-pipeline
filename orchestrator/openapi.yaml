    MeasurementKind:
      type: string
      enum:
      - download
      - process
      - upload
      title: MeasurementKind
      description: What a worker timed, to feed the rolling stats (design §5).
    NextTaskRequest:
      properties:
        accept_kinds:
          items:
            $ref: '#/components/schemas/TaskKind'
          type: array
          minItems: 1
          title: Accept Kinds
      additionalProperties: false
      type: object
      required:
      - accept_kinds
      title: NextTaskRequest
      description: 'Body of POST /workers/{id}/next: which kinds the worker can take now.


        Design §5: at most one job per stage, so a worker that is already

        processing omits "process" from this list.'
    NextTaskResponse:
      properties:
        task:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/DownloadRawTask'
            - $ref: '#/components/schemas/MakeProxyTask'
            - $ref: '#/components/schemas/ProcessTask'
            - $ref: '#/components/schemas/DeliverTask'
            discriminator:
              propertyName: kind
              mapping:
                deliver: '#/components/schemas/DeliverTask'
                download_raw: '#/components/schemas/DownloadRawTask'
                make_proxy: '#/components/schemas/MakeProxyTask'
                process: '#/components/schemas/ProcessTask'
          - type: 'null'
          title: Task
        retry_after_s:
          type: integer
          minimum: 0.0
          title: Retry After S
          default: 5
      additionalProperties: false
      type: object
      title: NextTaskResponse
      description: 'An offer, not a reservation: the worker must claim it before working.


        If two workers receive the same offer, only the first claim wins; the

        other gets 409 already_claimed and simply asks /next again.'
    OutboxAckRequest:
      properties:
        lease_id:
