                $ref: '#/components/schemas/Worker'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team / user / ... (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/settings:
    get:
      tags:
      - admin
      summary: Editable settings, plus Evolution state, secrets configured/missing, disk use
      description: 'Secrets (Evolution key, Tailscale OAuth secret, webhook secret, admin

        token) stay in .env and are never sent: only "configured" or "missing".

        The settings'' .env values are first-start defaults only.'
      operationId: get_settings_admin_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionBearer: []
      - adminBearer: []
    patch:
      tags:
      - admin
      summary: Change intake mode, inbox soft cap, proxy eviction threshold or installer URL
      description: '`inbox_hold_gb` must not exceed BVP_INBOX_CAP_GB (400). A new

        `event_id` (or API address) syncs provas and teams at once; a failed

        sync does not undo the change (see `status.results_sync`).'
      operationId: update_settings_admin_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - sessionBearer: []
      - adminBearer: []
  /admin/results-sync:
    post:
      tags:
      - admin
      summary: Fetch the configured event's provas and teams from the Baja results API now
      description: 'Also runs by itself when the event id changes and every 6 h while one

        is set. Provas are keyed by the API''s prova id, teams by car number; a

        sync adds and renames, and marks rows the API stopped listing inactive

        (never deletes them). Admin corrections of synced teams are kept.


        No event id set → 400. Event id unknown to the API → 422 (details: the

        report). API unreachable or rate-limited → 503 `upstream_error`. The

        report is kept either way (GET /admin/settings, `status.results_sync`).'
      operationId: sync_from_results_api_admin_results_sync_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsSyncReport'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Well-formed but wrong (hash_mismatch, missing_review_fields, unknown_prova, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable (dev_mode_disabled, upstream_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionBearer: []
      - adminBearer: []
  /admin/audit:
    get:
      tags:
      - admin
      summary: The newest admin changes (newest first), optionally of one admin page
      description: 'Events whose actor is "admin" (the token) or "admin:<username>"; each

        carries `details: {before, after}`. Unlike GET /events: newest first.'
      operationId: admin_audit_admin_audit_get
      security:
      - sessionBearer: []
      - adminBearer: []
      parameters:
      - name: area
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AdminArea'
          - type: 'null'
          title: Area
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AdminArea:
      type: string
      enum:
      - users
      - contacts
      - provas
      - teams
      - enrollment
      - workers
      - settings
      title: AdminArea
      description: One admin page, for GET /admin/audit?area=… (its latest changes).
    AdminSettings:
      properties:
        intake_mode:
          $ref: '#/components/schemas/IntakeMode'
        inbox_hold_gb:
          type: number
          exclusiveMinimum: 0.0
          title: Inbox Hold Gb
        proxy_evict_min_free_gb:
          type: number
          minimum: 0.0
          title: Proxy Evict Min Free Gb
        installer_download_url:
          type: string
          maxLength: 500
          title: Installer Download Url
        event_id:
          type: string
          pattern: ^([A-Za-z0-9]{4})?$
          title: Event Id
          default: ''
        results_api_base_url:
          type: string
          maxLength: 200
          title: Results Api Base Url
          default: https://api.bajasaebrasil.net
      additionalProperties: false
      type: object
      required:
      - intake_mode
      - inbox_hold_gb
      - proxy_evict_min_free_gb
      - installer_download_url
      title: AdminSettings
      description: Settings the operator edits in the UI. The .env values are only first-start defaults.
    ArchiveClipTask:
      properties:
        kind:
          type: string
          const: archive_clip
          title: Kind
          default: archive_clip
        job_id:
          type: string
          title: Job Id
        version:
          type: integer
          minimum: 1.0
          title: Version
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        archive_relative_path:
          type: string
          title: Archive Relative Path
        download_urls:
          items:
            type: string
          type: array
          title: Download Urls
      additionalProperties: false
      type: object
      required:
      - job_id
      - version
      - sha256
      - size_bytes
      - archive_relative_path
      title: ArchiveClipTask
      description: 'Master only: keep a copy of one finished clip version in the archive folder.


        Lowest priority, after live work and raw backfill. If the master has

        the clip itself (it rendered it), it moves its own copy; otherwise it

        GETs the first URL that works: the rendering worker''s file server

        ("http://<peer>:8710/clip/<job_id>?sha256=…", no token) or the VPS outbox

        (Caddy, send your token). Then POST /jobs/{id}/clip-archived.'
    Body_test_upload_intake_test_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: The video file.
        sender_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Name
        received_as:
          $ref: '#/components/schemas/ReceivedAs'
          description: Send "video" to simulate a low_res intake.
          default: test_upload
      type: object
      required:
      - file
      title: Body_test_upload_intake_test_upload_post
    CatalogSource:
      type: string
      enum:
      - manual
      - results_api
      title: CatalogSource
      description: Where a prova or a team row came from.
    ChunkAccepted:
      properties:
        received_bytes:
          type: integer
          minimum: 0.0
          title: Received Bytes
        complete:
          type: boolean
          title: Complete
      additionalProperties: false
      type: object
      required:
      - received_bytes
      - complete
      title: ChunkAccepted
      description: Answer to every accepted chunk of a chunked upload (see docs/api.md).
    ClaimRequest:
      properties:
        task_kind:
          $ref: '#/components/schemas/TaskKind'
      additionalProperties: false
      type: object
      required:
      - task_kind
      title: ClaimRequest
    ClaimResponse:
      properties:
        lease:
          $ref: '#/components/schemas/Lease'
        task:
          oneOf:
          - $ref: '#/components/schemas/DownloadRawTask'
          - $ref: '#/components/schemas/MakeProxyTask'
          - $ref: '#/components/schemas/ProcessTask'
          - $ref: '#/components/schemas/DeliverTask'
          - $ref: '#/components/schemas/ArchiveClipTask'
          title: Task
          discriminator:
            propertyName: kind
            mapping:
              archive_clip: '#/components/schemas/ArchiveClipTask'
              deliver: '#/components/schemas/DeliverTask'
              download_raw: '#/components/schemas/DownloadRawTask'
              make_proxy: '#/components/schemas/MakeProxyTask'
              process: '#/components/schemas/ProcessTask'
      additionalProperties: false
      type: object
      required:
      - lease
      - task
      title: ClaimResponse
    ClipArchiveProgress:
      properties:
        archived:
          type: integer
          minimum: 0.0
          title: Archived
        total:
          type: integer
          minimum: 0.0
          title: Total
      additionalProperties: false
      type: object
      required:
      - archived
      - total
      title: ClipArchiveProgress
      description: How much of every clip ever rendered (all versions) the master has.
    ClipArchivedRequest:
      properties:
        lease_id:
          type: string
          title: Lease Id
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
      additionalProperties: false
      type: object
      required:
      - lease_id
      - sha256
      title: ClipArchivedRequest
      description: 'POST /jobs/{id}/clip-archived: the master stored that exact clip, hash checked.'
    ClipInfo:
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        relative_path:
          type: string
          title: Relative Path
        route:
          $ref: '#/components/schemas/DeliveryRoute'
        rendered_by_worker_id:
          type: string
          title: Rendered By Worker Id
        delivered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Delivered At
        version:
          type: integer
          minimum: 1.0
          title: Version
          default: 1
        in_outbox:
          type: boolean
          title: In Outbox
          default: false
        download_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Download Url
      additionalProperties: false
      type: object
      required:
      - sha256
      - size_bytes
      - relative_path
      - route
      - rendered_by_worker_id
      title: ClipInfo
      description: The finished, rendered clip (the current version).
    ClipVersion:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        relative_path:
          type: string
          title: Relative Path
        archive_relative_path:
          type: string
          title: Archive Relative Path
        rendered_by_worker_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Rendered By Worker Id
        rendered_at:
          type: string
          format: date-time
          title: Rendered At
        archived_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archived At
      additionalProperties: false
      type: object
      required:
      - version
      - sha256
      - size_bytes
      - relative_path
      - archive_relative_path
      - rendered_at
      title: ClipVersion
      description: One rendering of a job's clip. Reprocessing adds a version; none is replaced.
    Contact:
      properties:
        phone:
          type: string
          title: Phone
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        push_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Push Name
        status:
          $ref: '#/components/schemas/ContactStatus'
        default_prova_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Default Prova Id
        default_prova:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Prova
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        first_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Seen At
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen At
      additionalProperties: false
      type: object
      required:
      - phone
      - status
      title: Contact
    ContactStatus:
      type: string
      enum:
      - allowed
      - blocked
      - unknown
      title: ContactStatus
      description: What intake does with a WhatsApp sender (admin Contacts page).
    ContactsResponse:
      properties:
        contacts:
          items:
            $ref: '#/components/schemas/Contact'
          type: array
          title: Contacts
      additionalProperties: false
      type: object
      required:
      - contacts
      title: ContactsResponse
    CreateContactRequest:
      properties:
        phone:
          type: string
          maxLength: 32
          minLength: 8
          title: Phone
        display_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Display Name
        status:
          $ref: '#/components/schemas/ContactStatus'
          default: allowed
        default_prova_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Default Prova Id
        notes:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      required:
      - phone
      title: CreateContactRequest
      description: Add a sender before they write (e.g. to allow them in allowlist mode).
    CreateEnrollmentTokenRequest:
      properties:
        volunteer_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Volunteer Name
        role:
          $ref: '#/components/schemas/WorkerRole'
          default: worker
        valid_for_hours:
          type: integer
          maximum: 720.0
          minimum: 1.0
          title: Valid For Hours
          default: 72
      additionalProperties: false
      type: object
      required:
      - volunteer_name
      title: CreateEnrollmentTokenRequest
    CreateProvaRequest:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
      additionalProperties: false
      type: object
      required:
      - name
      title: CreateProvaRequest
    CreateUserRequest:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9._@-]+$
          title: Username
        password:
          type: string
          maxLength: 72
          minLength: 8
          title: Password
        role:
          $ref: '#/components/schemas/UserRole'
          default: reviewer
      additionalProperties: false
      type: object
      required:
      - username
      - password
      title: CreateUserRequest
    CurrentUser:
      properties:
        username:
          type: string
          title: Username
        role:
          $ref: '#/components/schemas/UserRole'
      additionalProperties: false
      type: object
      required:
      - username
      - role
      title: CurrentUser
      description: Who a session belongs to (GET /auth/me).
    DeliverTask:
      properties:
        kind:
          type: string
          const: deliver
          title: Kind
          default: deliver
        job_id:
          type: string
          title: Job Id
        download_url:
          type: string
          title: Download Url
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        clip_relative_path:
          type: string
          title: Clip Relative Path
      additionalProperties: false
      type: object
      required:
      - job_id
      - download_url
      - sha256
      - size_bytes
      - clip_relative_path
      title: DeliverTask
      description: 'Studio only: pull a clip from the VPS outbox.'
    DeliveredRequest:
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        relative_path:
          type: string
          title: Relative Path
      additionalProperties: false
      type: object
      required:
      - sha256
      - size_bytes
      - relative_path
      title: DeliveredRequest
      description: 'POST /jobs/{id}/delivered: studio ACK after a direct push from a worker.'
    DeliveryPlan:
      properties:
        mode:
          $ref: '#/components/schemas/DeliveryRoute'
        studio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Studio Url
      additionalProperties: false
      type: object
      required:
      - mode
      title: DeliveryPlan
      description: 'How a process task should deliver its clip; decided by the orchestrator.


        "direct": a studio heartbeated in the last 45 s; push the clip to

        `studio_url` (and fall back to the outbox if that push fails).

        "outbox": no studio is online; upload straight to the outbox.

        The worker never works this out itself from GET /workers (design §17).'
    DeliveryRoute:
      type: string
      enum:
      - direct
      - outbox
      title: DeliveryRoute
    DownloadRawTask:
      properties:
        kind:
          type: string
          const: download_raw
          title: Kind
          default: download_raw
        job_id:
          type: string
          title: Job Id
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        download_url:
          type: string
          title: Download Url
        fallback_download_urls:
          items:
            type: string
          type: array
          title: Fallback Download Urls
      additionalProperties: false
      type: object
      required:
      - job_id
      - sha256
      - size_bytes
      - download_url
      title: DownloadRawTask
      description: 'Fetch a raw and become one of its holders.


        Every URL is absolute and ready to GET with Range. The VPS inbox is

        "http://<vps tailscale ip>:8080/inbox/<name>" (Caddy, send your bearer

        token); a peer is "http://<peer tailscale ip>:8710/raw/<job_id>".'
    EnrollRequest:
      properties:
        enrollment_token:
          type: string
          title: Enrollment Token
        worker_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Worker Name
        hostname:
          anyOf:
          - type: string
          - type: 'null'
          title: Hostname
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'
        storage_cap_bytes:
          type: integer
          minimum: 0.0
          title: Storage Cap Bytes
      additionalProperties: false
      type: object
      required:
      - enrollment_token
      - worker_name
      - capabilities
      - storage_cap_bytes
      title: EnrollRequest
      description: POST /enroll, sent once by the worker's first-run setup page.
    EnrollResponse:
      properties:
        worker_id:
          type: string
          title: Worker Id
        role:
          $ref: '#/components/schemas/WorkerRole'
        bearer_token:
          type: string
          title: Bearer Token
        tailscale_auth_key:
          type: string
          title: Tailscale Auth Key
        tailscale_tags:
          items:
            type: string
          type: array
          title: Tailscale Tags
        tailnet_base_url:
          type: string
          title: Tailnet Base Url
        heartbeat_interval_s:
          type: integer
          title: Heartbeat Interval S
        lease_ttl_s:
          type: integer
          title: Lease Ttl S
      additionalProperties: false
      type: object
      required:
      - worker_id
      - role
      - bearer_token
      - tailscale_auth_key
      - tailscale_tags
      - tailnet_base_url
      - heartbeat_interval_s
      - lease_ttl_s
      title: EnrollResponse
    EnrollmentTokenCreated:
      properties:
        token:
          type: string
          title: Token
        token_id:
          type: string
          title: Token Id
        volunteer_name:
          type: string
          title: Volunteer Name
        role:
          $ref: '#/components/schemas/WorkerRole'
        expires_at:
          type: string
          format: date-time
          title: Expires At
        installer_download_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Installer Download Url
      additionalProperties: false
      type: object
      required:
      - token
      - token_id
      - volunteer_name
      - role
      - expires_at
      title: EnrollmentTokenCreated
    EnrollmentTokenInfo:
      properties:
        token_id:
          type: string
          title: Token Id
        volunteer_name:
          type: string
          title: Volunteer Name
        role:
          $ref: '#/components/schemas/WorkerRole'
        status:
          $ref: '#/components/schemas/EnrollmentTokenStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Used At
        used_by_worker_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Used By Worker Id
        used_by_worker_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Used By Worker Name
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      additionalProperties: false
      type: object
      required:
      - token_id
      - volunteer_name
      - role
      - status
      - created_at
      - expires_at
      title: EnrollmentTokenInfo
      description: One token on the admin Enrollment page. The token itself is never shown again.
    EnrollmentTokenStatus:
      type: string
      enum:
      - unused
      - used
      - expired
      - revoked
      title: EnrollmentTokenStatus
      description: Where a one-time enrollment token is in its life.
    EnrollmentTokensResponse:
      properties:
        tokens:
          items:
            $ref: '#/components/schemas/EnrollmentTokenInfo'
          type: array
          title: Tokens
      additionalProperties: false
      type: object
      required:
      - tokens
      title: EnrollmentTokensResponse
    ErrorBody:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
