          type: string
          title: Outbox Url
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        clip_relative_path:
          type: string
          title: Clip Relative Path
