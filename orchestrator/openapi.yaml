components:
  schemas:
    Body_test_upload_intake_test_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: The video file.
        sender_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Name
        received_as:
          $ref: '#/components/schemas/ReceivedAs'
          description: Send "video" to simulate a low_res intake.
          default: test_upload
      type: object
      required:
      - file
      title: Body_test_upload_intake_test_upload_post
    ChunkAccepted:
      properties:
        received_bytes:
          type: integer
          minimum: 0.0
          title: Received Bytes
        complete:
          type: boolean
          title: Complete
      additionalProperties: false
      type: object
      required:
      - received_bytes
      - complete
      title: ChunkAccepted
      description: Answer to every accepted chunk of a chunked upload (see docs/api.md).
    ClaimRequest:
      properties:
        task_kind:
          $ref: '#/components/schemas/TaskKind'
      additionalProperties: false
      type: object
      required:
      - task_kind
      title: ClaimRequest
    ClaimResponse:
      properties:
        lease:
          $ref: '#/components/schemas/Lease'
        task:
          oneOf:
          - $ref: '#/components/schemas/DownloadRawTask'
          - $ref: '#/components/schemas/MakeProxyTask'
          - $ref: '#/components/schemas/ProcessTask'
          - $ref: '#/components/schemas/DeliverTask'
          title: Task
          discriminator:
            propertyName: kind
            mapping:
              deliver: '#/components/schemas/DeliverTask'
              download_raw: '#/components/schemas/DownloadRawTask'
              make_proxy: '#/components/schemas/MakeProxyTask'
              process: '#/components/schemas/ProcessTask'
      additionalProperties: false
      type: object
      required:
      - lease
      - task
      title: ClaimResponse
    ClipInfo:
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        relative_path:
          type: string
          title: Relative Path
        route:
          $ref: '#/components/schemas/DeliveryRoute'
        rendered_by_worker_id:
          type: string
          title: Rendered By Worker Id
        delivered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Delivered At
      additionalProperties: false
      type: object
      required:
      - sha256
      - size_bytes
      - relative_path
      - route
      - rendered_by_worker_id
      title: ClipInfo
      description: The finished, rendered clip.
