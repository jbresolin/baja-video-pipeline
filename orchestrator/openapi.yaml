components:
  schemas:
    Body_test_upload_intake_test_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: The video file.
        sender_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Name
        received_as:
          $ref: '#/components/schemas/ReceivedAs'
          description: Send "video" to simulate a low_res intake.
          default: test_upload
      type: object
      required:
      - file
      title: Body_test_upload_intake_test_upload_post
    ChunkAccepted:
      properties:
        received_bytes:
          type: integer
          minimum: 0.0
          title: Received Bytes
        complete:
          type: boolean
          title: Complete
      additionalProperties: false
      type: object
      required:
      - received_bytes
      - complete
      title: ChunkAccepted
      description: Answer to every accepted chunk of a chunked upload (see docs/api.md).
    ClaimRequest:
      properties:
        task_kind:
          $ref: '#/components/schemas/TaskKind'
      additionalProperties: false
      type: object
      required:
      - task_kind
      title: ClaimRequest
    ClaimResponse:
      properties:
        lease:
          $ref: '#/components/schemas/Lease'
        task:
          oneOf:
          - $ref: '#/components/schemas/DownloadRawTask'
          - $ref: '#/components/schemas/MakeProxyTask'
          - $ref: '#/components/schemas/ProcessTask'
          - $ref: '#/components/schemas/DeliverTask'
          title: Task
          discriminator:
            propertyName: kind
            mapping:
              deliver: '#/components/schemas/DeliverTask'
              download_raw: '#/components/schemas/DownloadRawTask'
              make_proxy: '#/components/schemas/MakeProxyTask'
              process: '#/components/schemas/ProcessTask'
      additionalProperties: false
      type: object
      required:
      - lease
      - task
      title: ClaimResponse
    ClipInfo:
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        relative_path:
          type: string
          title: Relative Path
        route:
          $ref: '#/components/schemas/DeliveryRoute'
        rendered_by_worker_id:
          type: string
          title: Rendered By Worker Id
        delivered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Delivered At
      additionalProperties: false
      type: object
      required:
      - sha256
      - size_bytes
      - relative_path
      - route
      - rendered_by_worker_id
      title: ClipInfo
      description: The finished, rendered clip.
    CreateEnrollmentTokenRequest:
      properties:
        volunteer_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Volunteer Name
        role:
          $ref: '#/components/schemas/WorkerRole'
          default: worker
        valid_for_hours:
          type: integer
          maximum: 720.0
          minimum: 1.0
          title: Valid For Hours
          default: 72
      additionalProperties: false
      type: object
      required:
      - volunteer_name
      title: CreateEnrollmentTokenRequest
    DeliverTask:
      properties:
        kind:
          type: string
          const: deliver
          title: Kind
          default: deliver
        job_id:
          type: string
          title: Job Id
        download_url:
          type: string
          title: Download Url
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        clip_relative_path:
          type: string
          title: Clip Relative Path
      additionalProperties: false
      type: object
      required:
      - job_id
      - download_url
      - sha256
      - size_bytes
      - clip_relative_path
      title: DeliverTask
      description: 'Studio only: pull a clip from the VPS outbox.'
    DeliveredRequest:
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        relative_path:
          type: string
          title: Relative Path
      additionalProperties: false
      type: object
      required:
      - sha256
      - size_bytes
      - relative_path
      title: DeliveredRequest
      description: 'POST /jobs/{id}/delivered: studio ACK after a direct push from a worker.'
    DeliveryPlan:
      properties:
        mode:
          $ref: '#/components/schemas/DeliveryRoute'
        studio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Studio Url
      additionalProperties: false
      type: object
      required:
      - mode
      title: DeliveryPlan
      description: 'How a process task should deliver its clip; decided by the orchestrator.


        "direct": a studio heartbeated in the last 45 s; push the clip to

        `studio_url` (and fall back to the outbox if that push fails).

        "outbox": no studio is online; upload straight to the outbox.

        The worker never works this out itself from GET /workers (design §17).'
    DeliveryRoute:
      type: string
      enum:
      - direct
      - outbox
      title: DeliveryRoute
    DownloadRawTask:
      properties:
        kind:
          type: string
          const: download_raw
          title: Kind
          default: download_raw
        job_id:
          type: string
          title: Job Id
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
