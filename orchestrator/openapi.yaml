openapi: 3.1.0
info:
  title: Baja video pipeline — orchestrator API
  description: 'Orchestrator API of the Baja video pipeline v2. Generated from

    tools/openapi_contract (FastAPI stubs over shared.models); prose,

    flows and the chunked upload protocol are in docs/api.md.

    Do not edit this file by hand: run `uv run python tools/generate_openapi.py`.

    '
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - meta
      summary: Liveness check (no auth)
      description: 'Answers {"status": "ok"} when the process is up. For Caddy and monitoring.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /intake/evolution-webhook:
    post:
      tags:
      - intake
      summary: Evolution instance webhook (messages.upsert) → background download → job
      description: "Exact route Caddy forwards: `POST /intake/evolution-webhook`, with the\n`X-Webhook-Secret`\
        \ header (wrong or missing → 401).\n\n* Only `event == \"messages.upsert\"` with `data.key.fromMe\
        \ == false` is\n  considered; anything else gets 200 with `ignored: true`.\n* A `documentMessage`\
        \ (also inside `documentWithCaptionMessage`) with a\n  `video/*` mimetype → normal job. A `videoMessage`\
        \ → `low_res: true`\n  (the bot asks for a resend as document). Other messages → 200 ignored.\n\
        * Answer fast: 202 `accepted: true`, then download the encrypted file\n  from the WhatsApp CDN\
        \ and decrypt it while streaming\n  (`shared.whatsapp_media.download_incoming_media`) into the\
        \ inbox. The\n  job is created in state `received` only after every check passed;\n  on failure\
        \ no job is created and the bot asks the sender to resend.\n* Duplicate `data.key.id` (in progress\
        \ or done) → 200 `duplicate: true`\n  with the existing `job_id` if there is one.\n* Inbox above\
        \ BVP_INBOX_CAP_GB → 413 `inbox_full`. Above\n  BVP_INBOX_HOLD_GB the media is still accepted\
        \ but the bot asks the\n  sender to hold further videos."
      operationId: evolution_webhook_intake_evolution_webhook_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvolutionWebhook'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
        '200':
          description: Ignored or duplicate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large (upload_too_large, inbox_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - webhookSecret: []
  /intake/test-upload:
    post:
      tags:
      - intake
      summary: 'Dev only: upload a file as if it came from WhatsApp'
      description: 'Same result as the webhook, from a multipart upload.


        Enabled only when the orchestrator runs with BVP_DEV_MODE=1; otherwise

        503 `dev_mode_disabled`.'
      operationId: test_upload_intake_test_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_test_upload_intake_test_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large (upload_too_large, inbox_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable (dev_mode_disabled, upstream_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - adminBearer: []
  /admin/enrollment-tokens:
    post:
      tags:
      - enrollment
      summary: Create a one-time enrollment token for a volunteer
      description: The plaintext token is returned once; only its SHA-256 is stored.
      operationId: create_enrollment_token_admin_enrollment_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentTokenRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenCreated'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - adminBearer: []
  /enroll:
    post:
      tags:
      - enrollment
      summary: Exchange a one-time token for worker id, bearer token and Tailscale key
      description: 'No auth header: the enrollment token in the body is the credential.

        The one API route Caddy exposes publicly (design §8, §15).


        **Rate limit (enforced by the orchestrator, not Caddy):** at most

        10 requests per source IP per 600 s (BVP_ENROLL_RATE_LIMIT_REQUESTS,

        BVP_ENROLL_RATE_LIMIT_WINDOW_S), counting every request, successful or

        not. Over the limit → 429 `rate_limited` with a `Retry-After` header

        (seconds). The source IP is the last `X-Forwarded-For` entry when the

        request comes from Caddy, else the TCP peer address.


        The token is marked used on success, so a second call with it gets 401

        `enrollment_token_invalid` (also for unknown or expired tokens). The

        Tailscale key is minted through the Tailscale API (OAuth client,

        auth-keys scope) as single-use, pre-approved, non-ephemeral and tagged

        `tag:worker` (or `tag:studio` for the studio role). If the Tailscale API

        fails: 503 `upstream_error` and the token stays unused.


        The answer''s `tailnet_base_url` is Caddy''s tailnet listener. The worker

        sends its bearer token only to that origin and to its configured

        orchestrator URL (design §17), never to a peer or the studio.'
      operationId: enroll_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests from this source IP (rate_limited); see Retry-After
          headers:
            Retry-After:
              description: Seconds until this source IP may try again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable (dev_mode_disabled, upstream_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/heartbeat:
    post:
      tags:
      - worker loop
      summary: 'Every 15 s: disk, measurements, and renew listed leases'
      description: '`worker_id` must be the caller''s own id (else 403). The answer''s

        `deletable_job_ids` lists held raws of discarded jobs.'
      operationId: heartbeat_workers__worker_id__heartbeat_post
      security:
      - workerBearer: []
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{worker_id}/next:
    post:
      tags:
      - worker loop
      summary: 'Pull: what should I do next? (an offer; claim it to start)'
      description: 'Returns at most one task among `accept_kinds`, or `task: null`.


        Never offers `download_raw` to a studio or to a worker that is not

        accepting new raws; never offers `make_proxy`/`process` to a worker

        that is not a confirmed holder; only offers `deliver` to studios.

        Offers that move bytes carry an absolute `download_url`: Caddy''s

        tailnet listener (`http://<vps tailscale ip>:8080/inbox/<name>` or

        `/outbox/<name>`, send your bearer token) or a peer''s file server

        (`http://<peer tailscale ip>:8710/raw/<job_id>`, no token).


        `process` offers carry `delivery`: `direct` with the studio''s

        `studio_url` when a studio heartbeated in the last 45 s, else `outbox`.

        The master is also offered `download_raw` for every non-discarded job

        it does not hold (including `done` and `failed`), after all live work.'
      operationId: next_task_workers__worker_id__next_post
      security:
      - workerBearer: []
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          title: Worker Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NextTaskRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextTaskResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers:
    get:
      tags:
      - worker loop
      summary: Peer list with tailnet addresses (for peer raw fetches and studio push)
      operationId: list_peers_workers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeersResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - workerBearer: []
  /jobs/{job_id}/claim:
    post:
      tags:
      - worker loop
      summary: Take a lease on one task of a job
      description: '409 `already_claimed` if someone else won; 409 `not_claimable` if

        the job is not in a state for that task or the caller is not eligible.

        Claiming `process` moves the job ready → claimed.'
      operationId: claim_jobs__job_id__claim_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/lease/renew:
    post:
      tags:
      - worker loop
      summary: Extend one lease (heartbeats also renew)
      description: 409 `lease_lost` if the lease already expired or was revoked.
      operationId: renew_lease_jobs__job_id__lease_renew_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseRenewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseRenewResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/file:
    get:
      tags:
      - worker loop
      summary: Caddy forward_auth target for /inbox/* and /outbox/* on the tailnet listener
      description: "Caddy calls this (forward_auth) before serving a file, copying the\nworker's `Authorization:\
        \ Bearer` header. 2xx allows; anything else is\npassed back to the worker as the answer.\n\n*\
        \ `/inbox/<job_id>.<ext>` → allowed while the caller holds a\n  download_raw lease for that job\
        \ (or is the master backfilling).\n* `/outbox/<job_id>.mp4` → allowed for studio workers only.\n\
        * Missing/unknown bearer → 401. Other paths, dot-files, `..`, other\n  workers' jobs, methods\
        \ other than GET/HEAD → 403."
      operationId: authorize_file_auth_file_get
      security:
      - workerBearer: []
      parameters:
      - name: X-Forwarded-Uri
        in: header
        required: true
        schema:
          type: string
          description: Path Caddy is about to serve, e.g. /inbox/x.mp4
          title: X-Forwarded-Uri
        description: Path Caddy is about to serve, e.g. /inbox/x.mp4
      - name: X-Forwarded-Method
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Forwarded-Method
      responses:
        '204':
          description: 'Allowed: Caddy serves the file'
          headers:
            X-Worker-Id:
              description: Id of the authenticated worker (for Caddy's access log)
              schema:
                type: string
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/failed:
    post:
      tags:
      - worker loop
      summary: Report an unrecoverable task error (a reviewer decides retry or discard)
      description: "Ends the lease named in the body (409 `lease_lost` if it is gone).\nThe worker is\
        \ never offered that task on that job again, whatever the\nscope.\n\n* `scope: \"job\"` (bad input:\
        \ hash mismatch at the source, undecodable\n  file) fails the job at once. `scope: \"worker\"\
        ` (the default: disk,\n  local ffmpeg crash, network) re-offers the task to other workers; it\n\
        \  fails the job only once two different workers reported `worker`\n  scope for the same task\
        \ on this job.\n* Failing the job is only possible from `received`, `proxy_ready` (any\n  task)\
        \ or `claimed` (the `process` lease): job → failed, `Job.failure`\n  set, `Job.failed_from` records\
        \ the state, other leases are revoked.\n  The review UI offers retry (back to `failed_from`, `claimed`\
        \ →\n  `ready`) or discard.\n* Otherwise (worker scope below the threshold, or a state that cannot\n\
        \  fail, e.g. a second holder's download after review) the job keeps its\n  state (a `claimed`\
        \ job goes back to `ready`) and `Job.failure` and\n  `waiting_reason` are set."
      operationId: report_failure_jobs__job_id__failed_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailedRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/holder-confirm:
    post:
      tags:
      - worker loop
      summary: I hold the raw and its SHA-256 matched
      description: 'Ends the download_raw lease. 422 `hash_mismatch` if the reported hash

        differs from the job''s (the caller is dropped as holder and must delete

        its copy).'
      operationId: holder_confirm_jobs__job_id__holder_confirm_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolderConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolderConfirmResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Well-formed but wrong (hash_mismatch, missing_review_fields, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/{job_id}/proxy:
    post:
      tags:
      - worker loop
      summary: Chunked upload of the 480p proxy (MP4)
      description: 'On the completing chunk: proxy stored, `proxy_available` true,

        `Job.frame_rate` set from the `Frame-Rate` header (send it on every

        chunk; the completing one counts), a `received` job moves to

        proxy_ready → awaiting_review, and the make_proxy lease ends. Upload

        the thumbnail *before* the proxy.'
      operationId: upload_proxy_jobs__job_id__proxy_post
      security:
      - workerBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: Upload-Offset
        in: header
        required: true
        schema:
          type: integer
          title: Upload-Offset
      - name: Upload-Length
        in: header
        required: true
        schema:
          type: integer
          title: Upload-Length
      - name: Upload-SHA256
        in: header
        required: true
        schema:
          type: string
          title: Upload-Sha256
      - name: Lease-Id
        in: header
        required: true
        schema:
          type: string
          title: Lease-Id
      - name: Frame-Rate
        in: header
        required: false
        schema:
          anyOf:
          - type: number
            exclusiveMinimum: 0
          - type: 'null'
          description: Proxy frames per second from ffprobe, e.g. 29.97 (stored as Job.frame_rate)
          title: Frame-Rate
        description: Proxy frames per second from ffprobe, e.g. 29.97 (stored as Job.frame_rate)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkAccepted'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job / worker / team (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with the current state (see error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large (upload_too_large, inbox_full)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Well-formed but wrong (hash_mismatch, missing_review_fields, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: One chunk of the file, starting at byte Upload-Offset. See docs/api.md, Chunked uploads.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /jobs/{job_id}/thumbnail:
    put:
      tags:
      - worker loop
      summary: Upload the review-queue thumbnail (one JPEG, single request)
