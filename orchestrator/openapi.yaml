      description: "Gauges (read on every scrape):\n\n* `bvp_jobs{state}`: jobs per state, every state\
        \ listed (0 included).\n* `bvp_workers_enrolled{role}`, `bvp_workers_online{role}`: online =\n\
        \  heartbeat within the 45 s lease TTL.\n* `bvp_storage_bytes{area=\"inbox\"|\"proxies\"|\"outbox\"\
        }` (proxies includes\n  thumbnails), `bvp_disk_free_bytes`, `bvp_inbox_hold_bytes`,\n  `bvp_inbox_cap_bytes`.\n\
        \nCounters (since the orchestrator started; reset on restart):\n\n* `bvp_task_offers_total{kind}`:\
        \ tasks offered by `/workers/{id}/next`.\n* `bvp_task_claims_total{kind}`: new leases created\
        \ by `/claim`.\n* `bvp_task_failures_total{kind,scope}`: reports accepted by `/failed`."
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Prometheus text exposition format 0.0.4
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionBearer: []
      - adminBearer: []
  /auth/login:
    post:
      tags:
      - auth
      summary: Sign in with username and password; returns a session token
      description: "No auth header: the password is the credential. Called by the review\nUI, never directly\
        \ by a browser (Caddy does not route /auth/* publicly).\n\n* Wrong username, wrong password or\
        \ a disabled user → 401\n  `unauthenticated` (the same answer for all three).\n* At most 20 attempts\
        \ per source IP per 600 s\n  (BVP_LOGIN_RATE_LIMIT_REQUESTS / _WINDOW_S) → 429 `rate_limited`\
        \ with\n  `Retry-After`. The source IP is the last `X-Forwarded-For` hop when\n  the caller is\
        \ a trusted proxy (the review UI passes Caddy's on).\n* The session ends after 12 h without a\
        \ request (`idle_timeout_s`), at\n  logout, or when an admin disables the user or changes their\
        \ password."
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed request (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or wrong credentials (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests from this source IP (rate_limited); see Retry-After
          headers:
            Retry-After:
              description: Seconds until this source IP may try again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
