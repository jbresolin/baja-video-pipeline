{# The status strip. data-version lets the page notice changes by others. #}
{% import "macros.html" as m with context %}
<div id="status-strip" class="status-strip" data-version="{{ job.version }}" data-state="{{ job.state }}" aria-live="polite">
  {% for note in notes %}
  <p class="note {{ note.level }}">{{ note.text }}{% if note.detail %} {{ m.english(note.detail) }}{% endif %}{% if note.at %} {{ m.time(note.at) }}.{% endif %}</p>
  {% endfor %}
</div>
