{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-status">{{ status_code }} · <code>{{ code }}</code></p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p><a href="/review/">Back to the queue</a></p>
</section>
{% endblock %}
