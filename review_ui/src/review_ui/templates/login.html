{% extends "base.html" %}
{% block title %}{{ t("login.title") }}{% endblock %}
{% block content %}
<section class="login">
  <h1>{{ t("login.title") }}</h1>
  <p class="hint">{{ t("login.hint") }}</p>
  {% if error %}<div class="banner error" role="alert"><p>{{ error }}</p></div>{% endif %}
  <form method="post" action="/review/login" class="stacked">
    <input type="hidden" name="next" value="{{ next_path }}">
    <label for="username">{{ t("login.username") }}</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="password">{{ t("login.password") }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">{{ t("login.submit") }}</button>
  </form>
</section>
{% endblock %}
